[build-system]
requires = [
    "setuptools >= 65",
    "setuptools_scm[toml]",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "spgl1"
description = "SPGL1: A solver for large-scale sparse reconstruction."
readme = "README.md"
authors = [
    {name = "David Relyea", email = "drrelyea@gmail.com"},
    {name = "Matteo Ravasi", email = "matteoravasi@gmail.com"},
]
license = {file = "License.md"}
keywords = ["algebra", "inverse problems", "large-scale optimization", "sparse reconstruction", "compressed sensing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy >= 1.21.0",
    "scipy >= 1.7.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest >= 7.0",
    "pytest-cov",
    "black >= 23.0",
    "isort >= 5.0",
    "flake8 >= 6.0",
    "pre-commit >= 3.0",
]
docs = [
    "sphinx >= 5.0",
    "sphinx-rtd-theme >= 1.0",
    "sphinx-gallery >= 0.11",
    "numpydoc >= 1.5",
    "nbsphinx >= 0.8",
    "matplotlib >= 3.5",
    "ipython >= 8.0",
]
jax = [
    "jax >= 0.4.0",
    "jaxlib >= 0.4.0",
]
torch = [
    "torch >= 2.0.0",
]
numba = [
    "numba >= 0.56.0",
]

[tool.setuptools.packages.find]
exclude = ["pytests"]

[tool.setuptools_scm]
version_file = "spgl1/version.py"
